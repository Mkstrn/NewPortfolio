    <div class="mail">
        
        <form id="mail">
            <h1>Lets Connect!</h1>
            <section id="linkedin">
                <a href="https://www.linkedin.com/in/micayla-stern/" 
                target="_blank" 
                rel="noopener noreferrer" 
                aria-label="Connect on LinkedIn"
                style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; background-color: #0A66C2; color: #ffffff; border-radius: 6px; text-decoration: none;">
                    <svg xmlns="http://w3.org" width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
                    </svg>
                </a>
            </section>
             <div class="form-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" placeholder="Your name..">
            </div>

            <div class="form-group">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" placeholder="Your last name..">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Your email..">
            </div>

            <div class="form-group">
                <label for="subject">Start Writing</label>
                <textarea id="subject" placeholder="I am contacting you for.."></textarea>
            </div>

            <input type="submit" value="Send">
        
        </form>
